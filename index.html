<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Consolidação Multivigente — Teste com normas originais</title><style>:root{--brand:#b00017;--brand-dark:#8c0012;--soft:#fdecef;--bg:#f4f5f7;--text:#20252b;--muted:#637080;--line:#d7dbe2;--ok:#1f6b42;--warn:#8a5707;--danger:#9b2c2c}
*{box-sizing:border-box}body{margin:0;background:var(--bg);font-family:Segoe UI,Arial,sans-serif;color:var(--text);font-size:14px}button,input,select,textarea{font:inherit}button{cursor:pointer}button:disabled{opacity:.5;cursor:default}a{color:var(--brand)}.shell{min-height:100vh;display:flex}.sidebar{width:255px;background:white;border-right:1px solid var(--line);display:flex;flex-direction:column;position:sticky;top:0;height:100vh;flex-shrink:0}.brand{display:flex;align-items:center;padding:15px 12px;gap:10px;border-bottom:3px solid var(--brand);font-size:11px;font-weight:800;line-height:1.4}.brand img{width:46px;height:46px;object-fit:contain}.sidebar-title{padding:20px 16px 12px;font-size:11px;font-weight:800;color:#777;text-transform:uppercase;letter-spacing:.07em}.navbtn{width:100%;border:0;border-left:4px solid transparent;background:#fff;padding:12px 14px;display:flex;gap:11px;align-items:center;text-align:left;color:var(--text)}.navbtn:hover{background:#f6f7f9}.navbtn.active{border-color:var(--brand);background:var(--soft);color:var(--brand)}.navbtn .num{border-radius:6px;min-width:27px;height:27px;background:#edf0f4;display:flex;justify-content:center;align-items:center;font-weight:700;font-size:12px}.navbtn.active .num{background:var(--brand);color:white}.navbtn strong{display:block;font-size:13px}.navbtn small{display:block;font-size:11px;color:var(--muted);margin-top:3px}.sidebar-footer{margin-top:auto;padding:16px;font-size:11px;line-height:1.5;border-top:1px solid var(--line);color:var(--muted)}.version{font-size:10px}main{min-width:0;flex:1}.topbar{background:var(--brand);color:#fff;padding:18px 26px;display:flex;align-items:center;justify-content:space-between}.topbar h1{font-size:21px;margin:0 0 4px}.topbar>div>div{font-size:13px;opacity:.9}.projectbar{background:white;border-bottom:1px solid var(--line);padding:12px 24px;display:flex;align-items:center;justify-content:space-between;gap:16px}.app{max-width:1520px;margin:auto;padding:22px 24px 48px}.panel{background:white;border:1px solid var(--line);border-radius:9px;padding:19px;margin-bottom:16px;box-shadow:0 1px 3px #00000005}.panel h2,.panel h3{margin:0 0 12px}.panel h2{font-size:20px}.panel h3{font-size:16px}.intro{line-height:1.6;margin-top:0;color:#475569}.hint{font-size:12px;color:var(--muted);line-height:1.5;margin-top:5px}.sectionhead{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;margin-bottom:12px}.sectionhead h2{margin:0}.grid{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:13px}.f2{grid-column:span 2}.f3{grid-column:span 3}.f4{grid-column:span 4}.f6{grid-column:span 6}.f8{grid-column:span 8}.f12{grid-column:span 12}label{display:block;font-weight:650;font-size:12px;margin-bottom:5px;color:#344054}input,select,textarea{width:100%;border:1px solid #bcc6d1;border-radius:6px;background:white;padding:8px 9px;color:#20252b}input:focus,select:focus,textarea:focus{outline:2px solid #edc8cd;border-color:var(--brand)}textarea{min-height:100px;resize:vertical;line-height:1.5}textarea.source{min-height:220px;font-family:Consolas,monospace;font-size:12px}textarea.code{font:12px/1.5 Consolas,monospace}.actions{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.btn{border:1px solid #b4bcc8;border-radius:6px;background:white;color:#303a46;padding:8px 12px;font-weight:550}.btn:hover{background:#f8f9fb}.btn.primary{background:var(--brand);border-color:var(--brand);color:white}.btn.primary:hover{background:var(--brand-dark)}.btn.small{padding:6px 9px;font-size:12px}.btn.danger{color:var(--danger);border-color:#dfb7bf}.btn.light{color:white;background:transparent;border-color:#ffffff80}.btn.link{border:none;background:transparent;color:var(--brand);padding:0}.mt{margin-top:14px}.notice,.info,.ok,.err{border:1px solid;border-radius:7px;padding:11px 13px;font-size:13px;line-height:1.6;margin-bottom:13px}.notice{background:#fff9eb;border-color:#ecd398;color:#775518}.info{background:#f1f5f9;border-color:#d4dfe9;color:#44536a}.ok{background:#eefaf1;border-color:#b9dfc3;color:#255e36}.err{background:#fff1f2;border-color:#edbac0;color:#8e2432}.empty{padding:26px;text-align:center;color:var(--muted);border:1px dashed #c7ced8;border-radius:7px;line-height:1.6;background:#fbfcfd}.card{border:1px solid var(--line);border-radius:8px;padding:15px;margin-top:12px;background:white}.card.pending{border-left:4px solid #d5a239}.card.applied{border-left:4px solid #5b9771}.card.conflict{border-left:4px solid #c65763}.card.ignored{opacity:.8}.title{font-weight:700;line-height:1.5}.meta{color:var(--muted);font-size:12px;line-height:1.5;margin-top:5px}.badge{display:inline-block;font-size:11px;font-weight:650;border-radius:5px;padding:4px 7px;background:#edf1f5;color:#435065;margin:2px 4px 2px 0}.badge.green{background:#e8f5ed;color:#276444}.badge.amber{background:#fff3d3;color:#82520a}.badge.red{background:#fdebef;color:#9c273a}.badge.blue{background:#e9f0fc;color:#315783}.metrics{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin:16px 0}.metric{padding:14px 16px;border:1px solid var(--line);border-radius:8px;background:white}.metric strong{display:block;font-size:25px;font-weight:750;margin-bottom:4px}.metric span{font-size:12px;color:var(--muted)}details{margin-top:12px}summary{cursor:pointer;color:#425167;font-weight:650;font-size:12px;line-height:1.5}pre,.textblock{white-space:pre-wrap;overflow-wrap:anywhere;background:#f7f9fb;border:1px solid #e6eaf0;border-radius:6px;padding:12px;line-height:1.65;font-size:13px}.textblock{margin:10px 0}.note{color:#4a5b70;font-size:12px;line-height:1.6;padding-top:5px}.source-tag{font-size:11px;color:var(--muted)}.filters{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:15px}.filters>*{flex:1;min-width:170px}.node-card{padding:12px;border:1px solid var(--line);border-left:3px solid #d2dbe6;border-radius:6px;margin:9px 0;background:#fcfdfe}.node-head{display:flex;align-items:center;gap:8px;margin-bottom:7px}.node-head .badge{white-space:nowrap}.node-head input{font-weight:600}.node-id{font-size:10px;color:#7a8593;font-family:Consolas,monospace}.portal-layout{display:grid;grid-template-columns:185px minmax(0,1fr) 215px;gap:16px;align-items:start}.version-panel{padding:12px;background:white;border:1px solid var(--line);border-radius:8px;max-height:75vh;overflow:auto;position:sticky;top:15px}.version-panel h3{font-size:13px;margin:0 0 10px}.version-card{display:block;text-align:left;width:100%;background:white;border:1px solid #d5dbe4;border-radius:7px;padding:10px;margin-top:7px;font-size:12px}.version-card.active{border-color:var(--brand);background:var(--soft)}.version-card strong{display:block}.version-card small{display:block;line-height:1.5;margin-top:4px;color:var(--muted)}.portal{background:white;border:1px solid var(--line);border-radius:8px;padding:28px 32px;line-height:1.75;overflow-wrap:anywhere}.portal h2{font-size:23px;margin:0 0 20px;line-height:1.4}.portal p{margin:12px 0}.portal .ementa{font-weight:650}.portal .nota{font-size:12px;color:#4a5b70;line-height:1.6;margin-top:-5px;white-space:pre-wrap}.portal .revoked,.portal .historical{color:#637080;text-decoration:line-through}.portal .redaction-block{margin:0 0 16px}.portal .history-block{margin-bottom:15px;border-left:2px solid #e2e8f0;padding-left:12px}.portal .structural{font-weight:750;text-align:center;white-space:pre-wrap;margin:20px 0 10px}.portal .unparsed{white-space:pre-wrap;border-left:3px solid #d5a239;padding-left:12px}.portal .preamble{margin-bottom:25px}.portal .closing{margin-top:30px;border-top:1px solid #e5e7eb;padding-top:15px}.toolbar{display:flex;gap:15px;flex-wrap:wrap;align-items:end;margin-bottom:16px}.toolbar>div{min-width:170px}.check{display:flex;align-items:center;gap:7px;font-weight:500}.check input{width:auto}.modal{position:fixed;inset:0;z-index:50;background:#15202b80;display:flex;align-items:flex-start;justify-content:center;padding:25px 15px;overflow:auto}.modal[hidden]{display:none}.modalbox{max-width:1050px;width:100%;background:white;border-radius:10px;padding:22px;box-shadow:0 20px 60px #0003}.modalbox h2{margin-top:0}.modal-footer{position:sticky;bottom:-22px;padding:14px 0;margin-top:14px;background:white;border-top:1px solid var(--line)}.toast{position:fixed;top:20px;right:20px;max-width:520px;padding:14px 20px;background:#253345;color:white;border-radius:8px;box-shadow:0 5px 20px #0003;z-index:100;line-height:1.5}.toast[hidden]{display:none}.comparison{display:grid;grid-template-columns:1fr 1fr;gap:12px}.comparison h4{margin:8px 0;font-size:12px;color:#5e6d7e}.tablewrap{overflow:auto}table{width:100%;border-collapse:collapse;font-size:12px}th,td{text-align:left;vertical-align:top;border-bottom:1px solid #e1e6ed;padding:10px;line-height:1.5}th{background:#f4f6f9}.danger-text{color:var(--danger)}.mobile-menu{display:none}.footnote{font-size:12px;color:var(--muted);line-height:1.6;margin-top:18px}hr{border:0;border-top:1px solid var(--line);margin:18px 0}.statusline{min-height:18px}.nowrap{white-space:nowrap}
@media(max-width:1250px){.portal-layout{grid-template-columns:160px minmax(0,1fr)}.altering-panel{grid-column:1/-1;position:static;display:flex;gap:8px;flex-wrap:wrap;max-height:none}.altering-panel h3{width:100%}.altering-panel .version-card{width:auto;flex:1;min-width:170px}.sidebar{width:225px}.app{padding:18px}.portal{padding:24px}}
@media(max-width:850px){.sidebar{display:none;width:235px;position:fixed;z-index:40;box-shadow:0 0 20px #0003}.sidebar.open{display:flex}.mobile-menu{display:block}.projectbar{align-items:flex-start;flex-direction:column;padding:12px 16px}.topbar{padding:16px}.topbar h1{font-size:18px}.grid{grid-template-columns:1fr 1fr}.f2,.f3,.f4,.f6,.f8{grid-column:span 1}.f12{grid-column:span 2}.portal-layout{display:flex;flex-direction:column}.version-panel{position:static;max-height:230px;width:100%}.portal{width:100%;padding:20px}.metrics{grid-template-columns:repeat(2,1fr)}.comparison{grid-template-columns:1fr}.modal{padding:8px}.modalbox{padding:16px}.app{padding:15px 12px}.sectionhead{flex-wrap:wrap}}
@media print{.sidebar,.topbar,.projectbar,.toolbar,.version-panel,.no-print,.toast{display:none!important}.app{padding:0}.portal-layout{display:block}.portal{border:0;padding:0}.portal p{break-inside:avoid}.shell,main{display:block}body{background:white}}
.portal .last-update{margin-top:26px;color:var(--text)}.portal .last-update p{margin:4px 0}.portal .update-rule{font:12px/1.3 Consolas,monospace;white-space:pre-wrap;overflow-wrap:anywhere}.portal .update-date{font-size:14px}

<noscript>Este protótipo precisa de JavaScript habilitado no navegador.</noscript><script>/*
 * Consolidação assistida — parser determinístico, sem dependências.
 *
 * Semântica: artigos são containers; o texto do caput pertence a artN_cpt.
 * Parágrafos são filhos do artigo; incisos são filhos do caput/parágrafo;
 * alíneas e itens conservam seus pais explícitos. IDs nunca são inferidos
 * somente pelo número do último componente. Texto não estruturado é mantido.
 *
 * Eventos são propostas: o parser não confirma, aplica ou publica alterações.
 * Texto original e artigo-fonte acompanham cada proposta/pendência. Reticências
 * indicam contexto preservado e nunca são redação substitutiva. Um artigo
 * integral usa subtree; caput simples usa node. Blocos parciais são decompostos
 * apenas quando cada trecho completo tem identidade inequívoca.
 */
(function (root) {
  'use strict';

  const MONTHS = ['janeiro','fevereiro','março','abril','maio','junho','julho','agosto','setembro','outubro','novembro','dezembro'];
  const TYPES = ['Ato das disposições constitucionais transitórias','Deliberação do Comitê Extraordinário Covid-19','Instrução Normativa da Diretoria-Geral','Decisão Normativa da Presidência','Decreto com Numeração Especial','Emenda à Constituição','Resolução sem Número','Portaria sem Número','Decreto sem Número','Lei Complementar','Lei Constitucional','Portaria Conjunta','Decisão Conjunta','Ordem de Serviço','Lei Delegada','Lei Adicional','Constituição','Deliberação','Decreto-Lei','Resolução','Portaria','Decisão','Decreto','Lei'];
  const FILE_TYPES = {LEI:'Lei',LCP:'Lei Complementar',LCD:'Lei Constitucional',LDL:'Lei Delegada',DEC:'Decreto',DNE:'Decreto com Numeração Especial',DSN:'Decreto sem Número',RAL:'Resolução',RES:'Resolução',DLB:'Deliberação',PRT:'Portaria',EMC:'Emenda à Constituição'};
  const TYPE_SOURCE = TYPES.map(escapeRe).join('|');
  const DATE_SOURCE = '(?:(\\d{1,2})[º°]?\\s+de\\s+([a-zç]+)\\s+de\\s+(\\d{4})|(\\d{1,2})[º°]?\\/(\\d{1,2})\\/(\\d{4}))';
  const ID_SOURCE = '\\b('+TYPE_SOURCE+')\\s+(?:(Federal|Estadual|Municipal)\\s+)?(?:n[.º°o]*|número)\\s*([\\d.]+)\\s*(?:,?\\s*de\\s+'+DATE_SOURCE+'|\\/(\\d{4})|,?\\s*de\\s+(\\d{4}))';
  const COMMENTS = {add:'Acréscimo',replace:'Alteração',revoke:'Revogação',revoke_all:'Revogação total',note:'Vide',renumber:'Renumeração'};

  function escapeRe(s) { return String(s).replace(/[.*+?^${}()|[\]\\]/g, '\\$&'); }
  function clean(s) { return String(s || '').replace(/^\uFEFF/,'').replace(/\r\n?/g,'\n').replace(/\u00a0/g,' '); }
  function linesOf(s) { return clean(s).split('\n').map(s=>s.trim()).filter(Boolean); }
  function noMarkup(s) { return String(s).replace(/^#{1,6}\s*/,'').replace(/^\*\*(.*?)\*\*$/,'$1').trim(); }
  function unique(a) { return [...new Set(a.filter(Boolean))]; }
  function dateISO(y,m,d) {
    y=Number(y);m=Number(m);d=Number(d);
    if(y<1000||y>9999||m<1||m>12||d<1||d>31)return '';
    const v=new Date(Date.UTC(y,m-1,d));
    return v.getUTCFullYear()===y&&v.getUTCMonth()===m-1&&v.getUTCDate()===d ? `${y}-${String(m).padStart(2,'0')}-${String(d).padStart(2,'0')}` : '';
  }
  function dateFromMatch(m,offset=1) {
    if(!m)return '';
    return m[offset] ? dateISO(m[offset+2],MONTHS.indexOf(m[offset+1].toLowerCase())+1,m[offset]) : dateISO(m[offset+5],m[offset+4],m[offset+3]);
  }
  function findIdentities(text) {
    const re=new RegExp(ID_SOURCE,'gi'),out=[];let m;
    while((m=re.exec(String(text)))) {
      const type=TYPES.find(t=>t.toLowerCase()===m[1].toLowerCase())||m[1];
      const date=m[4] ? dateISO(m[6],MONTHS.indexOf(m[5].toLowerCase())+1,m[4]) : m[7] ? dateISO(m[9],m[8],m[7]) : '';

function archiveCurrent(){if(!P.base.sourceText&&!P.documents.length)return true;try{let a=JSON.parse(localStorage.getItem(ARCHIVE)||'[]');if(!Array.isArray(a))a=[];a=a.filter(x=>x.id!==P.id);a.unshift(clone(P));localStorage.setItem(ARCHIVE,JSON.stringify(a));return true;}catch(e){if(confirm('O navegador não tem espaço para guardar o projeto atual entre os anteriores. Preparar o download do JSON e continuar?')){saveProject();return true;}toast('Operação cancelada. Salve uma cópia do projeto antes de continuar.',true);return false;}}
function modal(html){$('modalContent').innerHTML=html;$('modal').hidden=false;document.body.style.overflow='hidden';setTimeout(()=>$('modalContent').querySelector('input,textarea,select,button')?.focus(),0);}
function closeModal(){$('modal').hidden=true;$('modalContent').innerHTML='';document.body.style.overflow='';editing=null;}
function options(list,value,blank){return (blank?`<option value="">${esc(blank)}</option>`:'')+list.map(x=>{const [v,l]=Array.isArray(x)?x:[x,x];return `<option value="${esc(v)}" ${v===value?'selected':''}>${esc(l)}</option>`;}).join('');}
function badge(text,color=''){return `<span class="badge ${color}">${esc(text)}</span>`;}
function warningList(list){return [...new Set((list||[]).map(x=>typeof x==='string'?x:x.message||x.reason||JSON.stringify(x)))].map(x=>`<div class="notice">${esc(x)}</div>`).join('');}
function nodeText(n){if(n.type==='Artigo')return '';if(n.type==='Título estrutural')return [n.label,n.text].filter((v,i,a)=>v&&a.indexOf(v)===i).join('\n');if(n.type==='Ementa'||n.type==='Bloco não estruturado')return n.text||n.label;const t=(n.text||'').trim();if(n.label&&t.toLowerCase().startsWith(n.label.toLowerCase()))return t;return `${n.label||''}${n.label?' – ':''}${t}`;}
function nodesText(nodes){return Engine.orderedNodes(nodes||[]).map(nodeText).filter(Boolean).join('\n');}
function eventNodeType(e){if(!e)return 'Dispositivo';if(e.operation==='revoke_all')return 'Norma';if(e.operation==='add'){const ns=e.nodes||[],ids=new Set(ns.map(n=>n.id));return ns.find(n=>!ids.has(n.parentId))?.type||'Dispositivo';}return allTargets().find(n=>n.id===e.targetId)?.type||'Dispositivo';}
function nodeLabel(id,nodes){const list=nodes||audit().nodes, n=list.find(x=>x.id===id)||P.base.structure.nodes.find(x=>x.id===id);if(!n)return id||'Norma inteira';const parts=[],seen=new Set();let curr=n;while(curr&&!seen.has(curr.id)){seen.add(curr.id);if(curr.type==='Caput')parts.push('caput');else parts.push(curr.label||curr.type);curr=list.find(x=>x.id===curr.parentId);}return parts.reverse().join(' › ');}
function allTargets(){const map=new Map();for(const n of P.base.structure.nodes||[])map.set(n.id,n);for(const e of P.events)if(e.status!=='ignored')for(const n of e.nodes||[])if(!map.has(n.id))map.set(n.id,n);for(const n of audit().nodes||[])map.set(n.id,n);return Engine.orderedNodes([...map.values()]).filter(n=>!['Título estrutural','Bloco não estruturado'].includes(n.type));}
function targetOptions(value,withRoot=false){const arr=allTargets();let s=withRoot?`<option value="" ${!value?'selected':''}>Norma-base — novo artigo</option>`:'<option value="">Selecione o dispositivo</option>';s+=arr.map(n=>`<option value="${esc(n.id)}" ${n.id===value?'selected':''}>${esc(nodeLabel(n.id,arr))} · ${esc(n.type)}${n.revoked?' (revogado)':''}</option>`).join('');if(value&&!arr.some(n=>n.id===value))s+=`<option value="${esc(value)}" selected>Alvo ainda não localizado: ${esc(value)}</option>`;return s;}
function identityFields(prefix,doc){const i=doc.identity||emptyIdentity();return `<div class="f3"><label for="${prefix}Type">Tipo da norma</label><select id="${prefix}Type">${options(TYPES,i.type)}</select></div><div class="f3"><label for="${prefix}Number">Número</label><input id="${prefix}Number" value="${esc(i.number)}" inputmode="numeric"></div><div class="f3"><label for="${prefix}Date">Data de sanção / data da norma</label><input type="date" id="${prefix}Date" value="${esc(i.date)}" onchange="App.syncYear('${prefix}')"></div><div class="f3"><label for="${prefix}Year">Ano</label><input id="${prefix}Year" value="${esc(i.year)}" inputmode="numeric" maxlength="4"></div>`;}
function dateFields(prefix,doc){const d=doc.dates||emptyDates(),c=doc.criterion||'manual';return `<div class="f3"><label for="${prefix}Publication">Data de publicação</label><input type="date" id="${prefix}Publication" value="${esc(d.publication)}" onchange="App.toggleDates('${prefix}')"></div><div class="f3"><label for="${prefix}Criterion">Critério de vigência</label><select id="${prefix}Criterion" onchange="App.toggleDates('${prefix}')">${options([['publication','Vigência na publicação'],['manual','Início da Vigência'],['effects','Início da produção de efeitos']],c==='publicacao'?'publication':c)}</select></div><div class="f3" id="${prefix}VigencyWrap"><label for="${prefix}Vigency">Início da vigência</label><input type="date" id="${prefix}Vigency" value="${esc(d.vigency)}"></div><div class="f3" id="${prefix}EffectsWrap"><label for="${prefix}Effects">Produção de efeitos (se houver)</label><input type="date" id="${prefix}Effects" value="${esc(d.effects)}"></div>`;}
function toggleDates(prefix){const c=val(prefix+'Criterion'),v=$(prefix+'Vigency'),e=$(prefix+'Effects');if(!v||!e)return;if(c==='publication'){v.value=val(prefix+'Publication');v.readOnly=true;}else{v.readOnly=false;if(c==='effects'&&!v.value)v.value=val(prefix+'Publication');}$(prefix+'VigencyWrap').style.display=c==='publication'?'none':'';$(prefix+'EffectsWrap').style.display=c==='publication'&&!e.value?'none':'';}
function syncYear(prefix){if(val(prefix+'Date'))$(prefix+'Year').value=val(prefix+'Date').slice(0,4);}
function readMeta(prefix){const criterion=val(prefix+'Criterion'),publication=val(prefix+'Publication'),date=val(prefix+'Date');return {identity:{type:val(prefix+'Type'),number:val(prefix+'Number').replace(/[.\s]/g,''),year:val(prefix+'Year')||date.slice(0,4),date},criterion,dates:{publication,vigency:criterion==='publication'?publication:val(prefix+'Vigency'),effects:val(prefix+'Effects')}};}
function hasBase(){return P.base.structure.nodes.some(n=>n.type==='Artigo');}
function requireBase(){if(hasBase())return true;toast('Importe primeiro o texto original da norma-base.',true);return false;}
function render(){cachedAudit=null;renderTop();$('nav').innerHTML=TABS.map(([id,num,title,sub])=>`<button class="navbtn ${tab===id?'active':''}" onclick="App.tab('${id}')"><span class="num">${num}</span><span><strong>${title}</strong><small>${sub}</small></span></button>`).join('');const map={base:renderBase,structure:renderStructure,documents:renderDocuments,review:renderReview,history:renderHistory,portal:renderPortal,files:renderFiles,about:renderAbout};$('content').innerHTML=map[tab]();if(tab==='base')toggleDates('base');if(tab==='portal')renderPortalResult();}
function switchTab(id){if(!TABS.some(x=>x[0]===id))return;persist();tab=id;render();$('sidebar').classList.remove('open');window.scrollTo({top:0,behavior:'instant'});}
function renderBase(){return `<section class="panel"><div class="sectionhead"><h2>1. Texto original da norma-base</h2>${hasBase()?badge('Norma carregada','green'):''}</div><p class="intro">Importe o original e depois confira a estrutura. Os textos das normas alteradoras entram na etapa 3.</p><div class="grid"><div class="f6"><label for="baseFile">Arquivo ODT, TXT ou HTML</label><input id="baseFile" type="file" accept=".odt,.txt,.html,.htm" onchange="App.importBaseFile(this)"><div class="hint">O ODT é lido no próprio navegador. Tabelas e trechos sem estrutura ficam identificados para revisão.</div></div><div class="f6"><div class="info">Uma norma-base por projeto. Cada alteradora será guardada separadamente, junto com as sugestões e as pendências.</div></div><div class="f12"><label for="baseText">Ou cole o texto integral da norma-base</label><textarea class="source" id="baseText" oninput="App.setDraft('base',this.value)" placeholder="Lei nº ...\nEmenta...\nArt. 1º – ...">${esc(draftBase)}</textarea><div class="actions mt"><button class="btn primary" onclick="App.importBaseText()">Estruturar texto da norma-base</button><button class="btn" onclick="App.demo()">Carregar exemplo fictício</button></div></div></div></section><section class="panel"><h3>Identificação e datas da norma-base</h3><div class="grid">${identityFields('base',P.base)}${dateFields('base',P.base)}</div><p class="hint">A data de publicação deve ser conferida na fonte. Vigência e efeitos são preservados separadamente. Datas específicas de um dispositivo podem ser ajustadas na conferência.</p><div class="actions mt"><button class="btn primary" onclick="App.saveBaseMeta()">Salvar identificação e datas</button><button class="btn" onclick="App.tab('structure')">Conferir estrutura</button></div></section>${P.base.sourceText?`<section class="panel"><h3>Texto-fonte preservado</h3><div class="meta">${esc(P.base.sourceName||'Texto colado')} · ${P.base.sourceText.length.toLocaleString('pt-BR')} caracteres</div><details><summary>Mostrar texto original importado</summary><pre>${esc(P.base.sourceText)}</pre></details></section>`:''}`;}
function renderStructure(){if(!hasBase())return '<div class="empty">Importe primeiro a norma-base na etapa 1.</div>';const list=Engine.orderedNodes(P.base.structure.nodes);return `<section class="panel"><div class="sectionhead"><h2>2. Conferir texto estruturado</h2><button class="btn small" onclick="App.addBaseNode()">Adicionar dispositivo</button></div><p class="intro">As correções abaixo são guardadas no projeto. O texto-fonte importado continua disponível na etapa 1.</p>${warningList(P.base.structure.warnings||P.base.warnings)}<div class="info">${list.filter(n=>n.type==='Artigo').length} artigos · ${list.filter(n=>!['Artigo','Ementa'].includes(n.type)).length} dispositivos e blocos. Confira especialmente alíneas, itens, títulos e anexos.</div>${list.map((n)=>{const idx=P.base.structure.nodes.findIndex(x=>x.id===n.id),depth=Math.min(4,n.id.split('_').length-1);return `<div class="node-card" style="margin-left:${depth*14}px"><div class="node-head">${badge(n.type)}<input aria-label="Rótulo do dispositivo ${esc(n.id)}" value="${esc(n.label)}" onchange="App.updateNode(${idx},'label',this.value)"><button class="btn small danger" onclick="App.removeBaseNode('${esc(n.id)}')">Excluir</button></div><div class="node-id">${esc(n.id)}${n.parentId?' · vinculado a '+esc(n.parentId):''}</div>${n.type==='Artigo'?'':`<textarea aria-label="Texto de ${esc(n.label||n.id)}" onchange="App.updateNode(${idx},'text',this.value)">${esc(n.text)}</textarea>`}</div>`;}).join('')}<hr><div class="grid"><div class="f12"><label>Preâmbulo</label><textarea onchange="App.updatePart('preamble',this.value)">${esc((P.base.structure.preamble||[]).join('\n'))}</textarea></div><div class="f6"><label>Fecho</label><textarea onchange="App.updatePart('closing',this.value)">${esc((P.base.structure.closing||[]).join('\n'))}</textarea></div><div class="f6"><label>Assinaturas</label><textarea onchange="App.updatePart('signatures',this.value)">${esc((P.base.structure.signatures||[]).join('\n'))}</textarea></div></div><div class="actions mt"><button class="btn primary" onclick="App.saveProject()">Salvar projeto completo</button><button class="btn" onclick="App.tab('documents')">Importar alteradoras</button></div></section>`;}
function counts(a){const result={applied:0,pending:0,confirmed:0,ignored:0};for(const r of a.results||[]){const e=P.events.find(x=>x.id===r.eventId);if(r.status==='applied'){result.applied++;if(e?.status==='confirmed')result.confirmed++;}else if(['pending','conflict'].includes(r.status))result.pending++;else if(r.status==='ignored')result.ignored++;}return result;}
function renderDocuments(){const a=audit();return `<section class="panel"><div class="sectionhead"><h2>3. Importar normas alteradoras</h2>${badge(P.documents.length+' documentos')}</div><p class="intro">Selecione vários arquivos de uma vez ou cole uma alteradora por vez. As sugestões ficam guardadas por documento. Complete a publicação e confira a vigência para gerar a prévia.</p><div class="grid"><div class="f12"><label for="amendFiles">Arquivos ODT, TXT ou HTML</label><input id="amendFiles" type="file" accept=".odt,.txt,.html,.htm" multiple onchange="App.importAmendFiles(this)"><div id="importProgress" class="hint"></div></div><div class="f12"><label for="amendText">Texto integral de uma norma alteradora</label><textarea id="amendText" class="source" oninput="App.setDraft('amendment',this.value)" placeholder="Inclua a identificação da norma e os dispositivos de vigência.">${esc(draftAmendment)}</textarea></div></div><div class="actions mt"><button class="btn primary" onclick="App.importAmendText()">Adicionar e identificar comandos</button><button class="btn" onclick="App.tab('review')">Conferir todas as alterações</button></div><div class="hint">Comandos ambíguos, renumerações, anexos e outros casos ainda não suportados permanecem pendentes. A prévia pode conter alterações ainda não conferidas.</div></section>${P.documents.length?P.documents.map(d=>{const ev=P.events.filter(e=>e.documentId===d.id),rs=a.results.filter(r=>ev.some(e=>e.id===r.eventId)),applied=rs.filter(r=>r.status==='applied').length,pending=rs.filter(r=>['pending','conflict'].includes(r.status)).length;return `<section class="panel"><div class="sectionhead"><div><h3>${esc(identityTitle(d.identity))}</h3><div class="meta">${esc(d.sourceName||'Texto colado')} · ${d.sourceText.length.toLocaleString('pt-BR')} caracteres</div></div><div class="actions"><button class="btn small" onclick="App.editDocument('${d.id}')">Identificação, datas e fonte</button><button class="btn small danger" onclick="App.removeDocument('${d.id}')">Excluir</button></div></div>${badge(ev.length+' sugestões')}${badge(applied+' aplicadas na prévia','green')}${pending?badge(pending+' pendentes','amber'):''}<div class="meta">Publicação: ${fmt(d.dates.publication)} · Vigência: ${fmt(d.dates.vigency|| (d.criterion==='publication'?d.dates.publication:''))}${d.dates.effects?' · Efeitos: '+fmt(d.dates.effects):''}</div>${warningList(d.warnings)}<details><summary>Comandos e cobertura da leitura</summary>${(d.coverage||[]).length?`<div class="tablewrap"><table><thead><tr><th>Artigo</th><th>Leitura</th><th>Observação</th></tr></thead><tbody>${d.coverage.map(c=>`<tr><td>${esc(c.article||c.number||'—')}</td><td>${esc(c.kind||c.status||'')}</td><td>${esc(c.reason||c.text||'')}</td></tr>`).join('')}</tbody></table></div>`:'<p class="hint">Sem quadro de cobertura disponível.</p>'}</details><div class="actions mt"><button class="btn small" onclick="App.filterDocument('${d.id}')">Conferir sugestões desta norma</button></div></section>`;}).join(''):'<div class="empty">Nenhuma alteradora importada.</div>'}`;}
function resultBadge(e,r){if(e.status==='ignored'||r?.status==='ignored')return badge('Desconsiderado','');if(r?.status==='conflict')return badge('Conflito — revisar','red');if(r?.status==='pending'||e.status==='pending')return badge('Pendente','amber');if(r?.status==='applied'&&e.status==='confirmed')return badge('Conferido','green');if(r?.status==='applied')return badge('Aplicado na prévia · a conferir','blue');return badge('A conferir','amber');}
function eventBeforeText(e,a){const nodes=[];for(const [id,arr] of Object.entries(a.history||{})){const i=arr.findIndex(v=>v.sourceEventId===e.id);if(i>0&&arr[i-1].node)nodes.push(arr[i-1].node);else if(arr.some(v=>v.removedBy===e.id)){const v=arr.find(v=>v.removedBy===e.id);if(v?.node)nodes.push(v.node);}}if(nodes.length)return nodesText(nodes);if(e.operation==='add')return 'Dispositivo ainda não existente antes do acréscimo.';const n=P.base.structure.nodes.find(n=>n.id===e.targetId);return n?nodesText([n]):'A redação anterior será mostrada após resolver as pendências desta operação.';}
function commandPeers(e){return e?.sourceArticle?P.events.filter(x=>x.documentId===e.documentId&&x.sourceArticle===e.sourceArticle&&String(x.sourcePart||'')===String(e.sourcePart||'')):[];}
function scopeDescription(e){if(e.scope!=='subtree')return 'Somente o texto do dispositivo';const n=(e.nodes||[]).find(n=>n.id===e.targetId);if(n?.type==='Caput'||/_cpt$/.test(e.targetId||'')){const incs=(e.nodes||[]).filter(x=>x.type==='Inciso'&&x.parentId===e.targetId);return 'Caput e seus incisos'+(incs.length?' ('+incs.map(x=>x.label).join(', ')+')':'')+' — não inclui parágrafos';}return 'Dispositivo e seus desdobramentos';}
function commandOverview(e){const peers=commandPeers(e);if(!e.sourceArticle)return '';return `<div class="info"><b>Operações do art. ${esc(e.sourceArticle)}: ${peers.length||1}</b>${peers.length?`<div class="actions mt">${peers.map(x=>x.id===e.id?`<span class="badge blue">${esc(nodeLabel(x.targetId)||'Norma inteira')} · atual</span>`:`<button class="btn small" onclick="App.openSibling('${esc(x.id)}')">${esc(nodeLabel(x.targetId)||'Norma inteira')}</button>`).join('')}</div>`:''}<div class="hint mt">Cada alvo expresso tem sua própria proposta. O caput pode incluir seus incisos, mas não os parágrafos. Para conferir outra operação, salve a atual primeiro.</div>${e.id&&docFor(e)?`<button class="btn small mt" onclick="App.reparseArticle()">Reanalisar apenas o art. ${esc(e.sourceArticle)}</button>`:''}</div>`;}
function eventCard(e,r,a){const d=docFor(e),idx=P.events.findIndex(x=>x.id===e.id),target=e.operation==='revoke_all'?'Norma inteira':e.operation==='add'?nodesText((e.nodes||[]).map(n=>({...n,text:''}))).split('\n').filter(Boolean).join(' / ')||nodeLabel(e.targetId):nodeLabel(e.targetId);const note=Engine.formatNote(e,d,eventNodeType(e));const reason=[...new Set([r?.reason,e.reason].filter(Boolean))].join(' ');return `<article class="card ${r?.status||e.status}" id="event_${idx}"><div class="sectionhead"><div><div class="title">${esc(OPS[e.operation]||e.operation)} — ${esc(target)}</div><div class="meta">${esc(identityTitle(d?.identity))} · ${e.sourceArticle?'art. '+esc(e.sourceArticle):'dispositivo de origem a conferir'}${e.sourcePart?' · '+esc(e.sourcePart):''}</div></div>${resultBadge(e,r)}</div>${reason?`<div class="${r?.status==='conflict'?'err':'notice'}">${esc(reason)}</div>`:''}<div class="meta">Publicação: ${fmt(r?.publicationDate||Engine.eventDates(e,d).publication)} · Aplicação na prévia: ${fmt(r?.availableFrom||Engine.eventDates(e,d).availableFrom)} · ${esc(scopeDescription(e))}${commandPeers(e).length>1?' · '+commandPeers(e).length+' operações deste comando':''}</div><div class="note">${esc(note)}</div><details><summary>Comparar texto, comando de origem e resultado</summary><div class="comparison"><div><h4>Redação anterior</h4><div class="textblock">${esc(eventBeforeText(e,a))}</div></div><div><h4>Resultado proposto</h4><div class="textblock">${esc(['revoke','revoke_all'].includes(e.operation)?'Revogação — preservar o texto tachado e acrescentar o vide.':e.operation==='note'?'Somente referência de vide; sem mudança na redação.':nodesText(e.nodes)||'Conteúdo ainda não estruturado.')}</div></div></div><h4>Comando original preservado</h4><pre>${esc(e.sourceText||'Não informado — cadastro manual.')}</pre></details><div class="actions mt"><button class="btn small" onclick="App.editEvent('${e.id}')">Revisar / corrigir</button>${r?.status==='applied'&&e.status!=='confirmed'?`<button class="btn small primary" onclick="App.confirmEvent('${e.id}')">Marcar como conferido</button>`:''}${e.status==='confirmed'?`<button class="btn small" onclick="App.unconfirmEvent('${e.id}')">Reabrir conferência</button>`:''}${e.status!=='ignored'?`<button class="btn small" onclick="App.ignoreEvent('${e.id}')">Desconsiderar</button>`:`<button class="btn small" onclick="App.restoreEvent('${e.id}')">Retomar análise</button>`}</div></article>`;}
function renderReview(){const a=audit(),c=counts(a),rm=new Map(a.results.map(r=>[r.eventId,r]));const ev=P.events.filter(e=>{const r=rm.get(e.id),s=filters.status;if(filters.document!=='all'&&e.documentId!==filters.document)return false;if(s==='pending'&&!['pending','conflict'].includes(r?.status))return false;if(s==='unreviewed'&&!(r?.status==='applied'&&e.status!=='confirmed'))return false;if(s==='confirmed'&&!(r?.status==='applied'&&e.status==='confirmed'))return false;if(s==='ignored'&&e.status!=='ignored')return false;return !filters.search||[e.sourceText,e.targetId,nodesText(e.nodes),identityTitle(docFor(e)?.identity)].join(' ').toLocaleLowerCase('pt-BR').includes(filters.search.toLocaleLowerCase('pt-BR'));});return `<section class="panel"><div class="sectionhead"><h2>4. Conferir alterações e vides</h2><button class="btn" onclick="App.newEvent()">Registrar alteração manual</button></div><p class="intro">As operações reconhecidas e com datas completas entram como proposta na prévia. Revise o comando, o alcance, a redação e o vide. Pendências e conflitos não são aplicados.</p><div class="metrics"><div class="metric"><strong>${P.events.length}</strong><span>Comandos / sugestões</span></div><div class="metric"><strong>${c.applied}</strong><span>Aplicados na prévia</span></div><div class="metric"><strong>${c.confirmed}</strong><span>Conferidos</span></div><div class="metric"><strong>${c.pending}</strong><span>Pendentes ou em conflito</span></div></div>${warningList(a.warnings)}<div class="filters"><select aria-label="Filtrar situação" onchange="App.setFilter('status',this.value)">${options([['all','Todas as situações'],['pending','Pendências e conflitos'],['unreviewed','Aplicadas, ainda não conferidas'],['confirmed','Conferidas'],['ignored','Desconsideradas']],filters.status)}</select><select aria-label="Filtrar norma" onchange="App.setFilter('document',this.value)">${options([['all','Todas as alteradoras'],...P.documents.map(d=>[d.id,identityTitle(d.identity)])],filters.document)}</select><input aria-label="Buscar comando" value="${esc(filters.search)}" placeholder="Buscar texto ou dispositivo" onchange="App.setFilter('search',this.value)"></div>${ev.length?ev.map(e=>eventCard(e,rm.get(e.id),a)).join(''):'<div class="empty">Nenhum comando neste filtro. Importe alteradoras ou registre uma alteração manual.</div>'}</section>`;}

// Portal: preserve logical histories, but group the visible redaction by the
// scope of the actual operation, not by each independent history array.
function nodeParagraph(n,historical=false){
  if(n.type==='Artigo')return '';
  const typeClass=n.type==='Ementa'?'ementa':n.type==='Título estrutural'?'structural':n.type==='Bloco não estruturado'?'unparsed':'';
  return `<p class="${typeClass} ${historical?'historical':n.revoked?'revoked':''}">${esc(nodeText(n)).replace(/\n/g,'<br>')}</p>`;
}
function portalNote(text){return text?`<p class="nota">${esc(text)}</p>`:'';}
function eventPortalNote(id,fallback,type,emitted){
  if(id&&emitted.has(id))return '';
  const event=P.events.find(e=>e.id===id);
  const note=event?Engine.formatNote(event,docFor(event),eventNodeType(event)):fallback;
  if(note&&id)emitted.add(id);
  return portalNote(note);
}
function supplementalNotes(n,emitted){

}
function historicalMarkup(n,r){

  for(let i=0;i<vs.length;i++){
    const v=vs[i],next=vs[i+1];
    if(i===vs.length-1&&!n.historyOnly)continue;
    if(!v.node||v.node.type==='Artigo')continue;
    if(next?.revoked&&nodeText(v.node)===nodeText(next.node))continue;

    html+=`<div class="history-block">${nodeParagraph(v.node,true)}${portalNote((src?Engine.formatNote(src,docFor(src),eventNodeType(src)):'('+v.node.type+' com redação na versão original.)'))}</div>`;

// Build disjoint outermost groups for subtree replacements actually applied
// by the selected date. Use the union of historical and live nodes so a
// removed child is not lost, and follow parentId (paragraphs are siblings of
// caput, not its children). Existing JSON projects need no migration.
function portalRedactionGroups(r,renderList){
  const applied=new Set((r.results||[]).filter(x=>x.status==='applied').map(x=>x.eventId));
  const byId=new Map(renderList.map(n=>[n.id,n]));
  function within(id,root){const seen=new Set();while(id&&!seen.has(id)){if(id===root)return true;seen.add(id);id=byId.get(id)?.parentId;}return false;}
  const roots=[...new Set(P.events.filter(e=>applied.has(e.id)&&e.operation==='replace'&&e.scope==='subtree'&&byId.has(e.targetId)).map(e=>e.targetId))];
  const top=roots.filter(id=>!roots.some(parent=>parent!==id&&within(id,parent)));

  for(const id of top){const members=renderList.filter(n=>within(n.id,id));if(members.filter(n=>n.type!=='Artigo').length<2)continue;groups.set(id,members);members.forEach(n=>owner.set(n.id,id));}

// The outer replacement defines a redaction period. Independent amendments
// inside that period are shown in the legal position of the affected child,
// not as detached blocks after the other siblings. A nested subtree replacement
// starts its own periods, limited to the surrounding period.
function redactionGroupMarkup(root,members,r,emitted){
  const live=new Map(r.nodes.map(n=>[n.id,n]));
  const eventMap=new Map(P.events.map(e=>[e.id,e]));
  const children=new Map();
  for(const n of members){if(!children.has(n.parentId))children.set(n.parentId,[]);children.get(n.parentId).push(n);}
  for(const group of children.values())group.sort(Engine.compareNodes);
  const endOfTime='9999-12-31';
  const versionsIn=(id,lo,hi)=>(r.history[id]||[]).filter(v=>v.node&&v.start<hi&&(!v.end||v.end>=lo));
  const ownReplacement=(v,n)=>{const e=eventMap.get(v.sourceEventId);return e?.operation==='replace'&&e.scope==='subtree'&&e.targetId===n.id;};
  const originalNoteFor=n=>portalNote('('+n.type+' com redação na versão original.)');

    const versions=versionsIn(n.id,lo,hi);
    if(!versions.length)return '';
    const cuts=[...new Set(versions.filter(v=>ownReplacement(v,n)&&v.start>lo&&v.start<hi).map(v=>v.start))].sort();
    const grouped=outermost||cuts.length>0||versions.some(v=>ownReplacement(v,n));
    const starts=grouped?[lo,...cuts]:[lo];
    let html='';
    for(let i=0;i<starts.length;i++){
      const from=starts[i],until=starts[i+1]||hi,vs=versionsIn(n.id,from,until);
      if(!vs.length)continue;
      const boundaryClosed=i<starts.length-1;
      const oldBlock=forceOld||boundaryClosed;
      const firstSource=vs[0].sourceEventId||null;
      const inheritedSource=grouped?firstSource:outerSource;
      let content='';
      for(let j=0;j<vs.length;j++){
        const v=vs[j],next=vs[j+1];
        if(next?.revoked&&nodeText(v.node)===nodeText(next.node))continue;
        const current=!v.end&&live.has(n.id),visible=current?live.get(n.id):v.node;
        const historical=oldBlock||!current;
        content+=nodeParagraph(visible,historical);
        const src=v.sourceEventId||null;
        // The block-level source is written after its last child. A separate
        // amendment (including an older version of an individual inciso) keeps
        // its own note immediately after that device. Original child notes are
        // only needed for a separate change inside this period.
        const blockOwnSource=grouped&&src===firstSource;
        if(!blockOwnSource){
          if(src&&src!==inheritedSource&&eventMap.get(src)?.operation!=='revoke_all'){

          }else if(!src&&next&&n.type!=='Artigo'){
            content+=originalNoteFor(n);
          }
        }
        if(current&&!oldBlock)content+=supplementalNotes(visible,emitted);
      }
      for(const child of children.get(n.id)||[])content+=renderNode(child,from,until,inheritedSource,oldBlock);
      if(grouped){
        if(firstSource&&firstSource!==outerSource&&eventMap.get(firstSource)?.operation!=='revoke_all'){
          content+=eventPortalNote(firstSource,vs[0].node.note,n.type,emitted);
        }else if(!firstSource&&boundaryClosed){
          content+=originalNoteFor(n);
        }
        html+=`<div class="redaction-block${oldBlock?' history-block':''}" data-redaction-root="${esc(n.id)}" data-redaction-source="${esc(firstSource||'original')}">${content}</div>`;
      }else html+=content;
    }
    return html;
  }

}
function portalMarkup(r){
  if(!hasBase())return '<div class="empty">Importe uma norma-base para começar.</div>';
  if(!r.available)return `<h2>${esc(identityTitle(P.base.identity))}</h2><div class="notice">${esc((r.warnings||[]).join(' ')||'Norma-base ainda não disponível nesta data. Confira a publicação, a vigência e os efeitos na etapa 1.')}</div>`;
  const emitted=new Set();let html=`<h2 class="${r.revokedAllBy?'revoked':''}">${esc(identityTitle(P.base.identity))}</h2>`;
  if(r.revokedAllBy)emitted.add(r.revokedAllBy);
  const list=Engine.orderedNodes(r.nodes),ementa=list.find(n=>n.id==='ementa');
  if(ementa)html+=historicalMarkup(ementa,r)+nodeParagraph(ementa)+eventPortalNote(ementa.sourceEventId,ementa.note,ementa.type,emitted)+supplementalNotes(ementa,emitted);
  if(r.revokedAllBy){const e=P.events.find(x=>x.id===r.revokedAllBy);if(e)html+=portalNote(Engine.formatNote(e,docFor(e),'Norma'));}
  html+=`<div class="preamble ${r.revokedAllBy?'revoked':''}">${(P.base.structure.preamble||[]).map(p=>`<p>${esc(p)}</p>`).join('')}</div>`;
  let renderList=list.filter(n=>n.id!=='ementa');
  if(multiMode){const map=new Map(renderList.map(n=>[n.id,n]));for(const [id,vs] of Object.entries(r.history||{})){if(id==='ementa')continue;if(!map.has(id)&&vs.length)map.set(id,{...vs[vs.length-1].node,historyOnly:true});}renderList=Engine.orderedNodes([...map.values()]);}

  // In the single-current-redaction view, keep the legal structure in order
  // and place the event's note after its last visible member, not its first.
  const lastForSource=new Map();
  for(const n of renderList){if(n.type==='Artigo'||n.historyOnly||owner.has(n.id))continue;if(n.note&&n.sourceEventId)lastForSource.set(n.sourceEventId,n.id);}
  for(const n of renderList){
    if(groups.has(n.id)){html+=redactionGroupMarkup(n,groups.get(n.id),r,emitted);continue;}
    if(owner.has(n.id)||n.type==='Artigo')continue;
    html+=historicalMarkup(n,r);
    if(n.historyOnly)continue;
    const parent=n.type==='Caput'?list.find(p=>p.id===n.parentId):null;
    const visible=parent?.notes?.length?{...n,notes:[...(n.notes||[]),...parent.notes]}:n;
    html+=nodeParagraph(visible);
    if(n.note&&(!n.sourceEventId||lastForSource.get(n.sourceEventId)===n.id))html+=eventPortalNote(n.sourceEventId,n.note,n.type,emitted);
    html+=supplementalNotes(visible,emitted);
  }
  html+=`<div class="closing ${r.revokedAllBy?'revoked':''}">${(P.base.structure.closing||[]).map(x=>`<p>${esc(x)}</p>`).join('')}${(P.base.structure.signatures||[]).map(x=>`<p><strong>${esc(x)}</strong></p>`).join('')}</div>`;
  html+=updateFooter(r);
  return html;
}

rtXML()">Baixar LexML experimental</button><button class="btn" onclick="App.exportAudit()">Baixar relatório de conferência</button></div><p class="hint">O LexML experimental incorpora a versão selecionada. Ele ainda precisa de validação no esquema oficial antes de uso em outro sistema; títulos, tabelas e blocos sem estrutura são sinalizados no XML.</p></section><section class="panel"><h3>Texto de referência para comparação</h3><p class="intro">Se desejar, cole o texto atualizado do portal. Ele fica guardado como referência e não altera o resultado reconstruído.</p><textarea id="referenceText" class="source" onchange="App.saveReference(this.value)">${esc(P.referenceText)}</textarea><label class="mt">Anotações da conferência</label><textarea onchange="App.saveReviewNotes(this.value)">${esc(P.reviewNotes)}</textarea></section>`;}
function renderAbout(){return `<section class="panel"><h2>Como testar esta versão</h2><ol><li>Carregue o original da norma-base e confirme identificação, publicação, vigência e efeitos.</li><li>Confira o texto estruturado, inclusive os dispositivos subordinados.</li><li>Importe as alteradoras, em arquivos separados. É possível selecionar vários arquivos juntos.</li><li>Complete a identificação e as datas de cada alteradora. A ausência de datas deixa suas operações pendentes.</li><li>Na conferência, compare cada comando com o alvo, a redação e o vide. Corrija os casos necessários e marque os itens conferidos.</li><li>Consulte as versões por data e salve o projeto completo em JSON.</li></ol><h3>Tratamento dos casos reconhecidos</h3><p class="intro">Acréscimos, novas redações e revogações expressas podem compor a prévia. Dispositivos acrescentados passam a existir para alterações posteriores. Revogações e substituições integrais respeitam os vínculos entre artigo, caput, parágrafo, inciso, alínea e item.</p><h3>Pendências visíveis</h3><p class="intro">Comandos ambíguos, alvos inexistentes, datas ausentes, conflitos na mesma data e operações sem implementação ficam pendentes. Renumerações, efeitos temporários complexos, alterações de anexos e modificações implícitas exigem tratamento próprio. Não se deve concluir que um texto está completo apenas porque a prévia foi gerada.</p><h3>Datas e consulta</h3><p class="intro">A consulta mostra o que já estava publicado e aplicável na data escolhida. A data de efeitos retroativos permanece registrada, mas uma norma não aparece antes de sua publicação. A mesma norma pode gerar mais de um marco de consulta; cada botão por norma abre a versão acumulada na data indicada.</p><h3>Arquivos e privacidade</h3><p class="intro">Este HTML funciona localmente, sem servidor e sem chamadas à rede. As fontes e as decisões ficam no projeto. Baixe o JSON para conservar uma cópia recuperável. A versão foi preparada para testes de consolidação e conferência humana.</p></section>`;}
